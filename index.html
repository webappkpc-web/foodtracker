<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกรายการอาหาร</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif, system-ui;
            background-color: #ffffff;
            color: #1f2937;
        }
    </style>
</head>
<body class="bg-white flex flex-col h-screen overflow-hidden select-none">

    <!-- ส่วนบน: ตรึงไว้ (Month Switcher) -->
    <header class="bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm z-10 shrink-0">
        <button id="prevMonthBtn" class="border border-blue-600 px-6 py-1.5 text-blue-600 font-bold hover:bg-blue-50 rounded transition text-lg">&lt;</button>
        <div id="currentMonthDisplay" class="text-xl font-bold text-gray-800">ต.ค.-69</div>
        <button id="nextMonthBtn" class="border border-blue-600 px-6 py-1.5 text-blue-600 font-bold hover:bg-blue-50 rounded transition text-lg">&gt;</button>
    </header>

    <!-- ส่วนกลาง: เลื่อนขึ้นลงได้ (Food List & Stars) -->
    <main class="flex-1 overflow-y-auto px-4 py-3 space-y-3">
        <!-- ตารางแสดงรายการอาหาร -->
        <div class="max-w-md mx-auto">
            <div class="grid grid-cols-12 text-blue-600 font-bold pb-2 border-b border-gray-200 text-sm">
                <div class="col-span-4">รายการ</div>
                <div class="col-span-3">หมวด</div>
                <div class="col-span-5 text-left">ดาว</div>
            </div>
            <!-- รายการอาหารจะถูกโหลดมาแสดงที่นี่ -->
            <div id="foodListContainer" class="divide-y divide-gray-100">
                <div class="py-2 text-center text-gray-400 text-sm">กำลังโหลดข้อมูล...</div>
            </div>
        </div>
    </main>

    <!-- ส่วนล่าง: ตรึงไว้ (Add Item Button) -->
    <footer class="bg-white border-t border-gray-100 p-4 flex justify-center shrink-0 z-10">
        <button id="openModalBtn" class="border border-blue-600 text-blue-600 hover:bg-blue-50 font-medium px-6 py-2 rounded-lg transition shadow-sm text-sm">
            เพิ่มรายการอาหาร/ขนม/เครื่องดื่ม
        </button>
    </footer>

    <!-- Modal เพิ่มรายการอาหาร -->
    <div id="addModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform transition-all">
            <h3 class="text-lg font-bold text-gray-800 mb-4">เพิ่มรายการอาหารใหม่</h3>
            <form id="addFoodForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">1. รายการ</label>
                    <input type="text" id="foodName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="เช่น ข้าวมันไก่">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">2. หมวด</label>
                    <select id="foodCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="ของคาว">ของคาว</option>
                        <option value="ของหวาน">ของหวาน</option>
                        <option value="น้ำ">น้ำ</option>
                        <option value="ขนม">ขนม</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">3. จำนวนที่กินได้สูงสุดใน 1 เดือน</label>
                    <input type="number" id="foodMaxCount" min="1" max="10" value="5" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" id="closeModalBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg text-sm font-medium transition">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal แก้ไข/ปรับปรุงรายการ -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 transform transition-all">
            <h3 class="text-lg font-bold text-gray-800 mb-4">แก้ไข/ปรับปรุงรายการ</h3>
            <form id="editFoodForm" class="space-y-4">
                <input type="hidden" id="editFoodId">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">1. รายการ</label>
                    <input type="text" id="editFoodName" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">2. หมวด</label>
                    <select id="editFoodCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="ของคาว">ของคาว</option>
                        <option value="ของหวาน">ของหวาน</option>
                        <option value="น้ำ">น้ำ</option>
                        <option value="ขนม">ขนม</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">3. จำนวนที่กินได้สูงสุดใน 1 เดือน</label>
                    <input type="number" id="editFoodMaxCount" min="1" max="10" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-center justify-between pt-3">
                    <button type="button" id="closeEditModalBtn" class="text-gray-600 hover:text-gray-800 text-sm font-medium">ยกเลิก</button>
                    <div class="flex space-x-2">
                        <button type="button" id="decreaseStarBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">ลดดาว</button>
                        <button type="button" id="deleteFoodBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">ลบ</button>
                        <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition shadow-sm">บันทึก</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, setDoc, deleteDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD88acC8R2ua6UPLy6X-8Wkz01WTiSQ-RI",
          authDomain: "foodtracker-a1.firebaseapp.com",
          projectId: "foodtracker-a1",
          storageBucket: "foodtracker-a1.firebasestorage.app",
          messagingSenderId: "592728471560",
          appId: "1:592728471560:web:8b9914cac3d8aa078df9bd",
          measurementId: "G-E5TXHWHX6T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const thaiMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        
        let currentDate = new Date();
        let currentYear = currentDate.getFullYear();
        let currentMonthIndex = currentDate.getMonth();

        function getMonthKey(year, monthIdx) {
            let thaiYear = (year + 543).toString().slice(-2);
            return `${thaiMonths[monthIdx]}-${thaiYear}`;
        }

        function updateMonthDisplay() {
            const displayStr = getMonthKey(currentYear, currentMonthIndex);
            document.getElementById('currentMonthDisplay').innerText = displayStr;
            loadData();
        }

        document.getElementById('prevMonthBtn').addEventListener('click', () => {
            currentMonthIndex--;
            if (currentMonthIndex < 0) {
                currentMonthIndex = 11;
                currentYear--;
            }
            updateMonthDisplay();
        });

        document.getElementById('nextMonthBtn').addEventListener('click', () => {
            currentMonthIndex++;
            if (currentMonthIndex > 11) {
                currentMonthIndex = 0;
                currentYear++;
            }
            updateMonthDisplay();
        });

        const addModal = document.getElementById('addModal');
        document.getElementById('openModalBtn').addEventListener('click', () => addModal.classList.remove('hidden') || addModal.classList.add('flex'));
        document.getElementById('closeModalBtn').addEventListener('click', () => addModal.classList.remove('flex') || addModal.classList.add('hidden'));

        const editModal = document.getElementById('editModal');
        document.getElementById('closeEditModalBtn').addEventListener('click', () => editModal.classList.remove('flex') || editModal.classList.add('hidden'));

        function renderStars(eatenCount, maxCount) {
            let starsHtml = '';
            for (let i = 0; i < maxCount; i++) {
                if (i < eatenCount) {
                    starsHtml += `<span class="text-red-500 font-bold text-lg inline-block">★</span>`;
                } else {
                    starsHtml += `<span class="text-gray-400 font-bold text-lg inline-block">★</span>`;
                }
            }
            return starsHtml;
        }

        async function loadData() {
            const container = document.getElementById('foodListContainer');
            container.innerHTML = `<div class="py-4 text-center text-gray-400 text-sm">กำลังโหลดข้อมูล...</div>`;

            const monthKey = getMonthKey(currentYear, currentMonthIndex);

            try {
                const [foodSnapshot, logsSnapshot] = await Promise.all([
                    getDocs(collection(db, "food_items")),
                    getDocs(query(collection(db, "food_logs"), where("monthKey", "==", monthKey)))
                ]);

                const foodItems = [];
                foodSnapshot.forEach((docSnap) => {
                    foodItems.push({ id: docSnap.id, ...docSnap.data() });
                });

                // เรียงลำดับข้อมูลตามชื่อรายการ (ภาษาไทยและอังกฤษ)
                foodItems.sort((a, b) => a.name.localeCompare(b.name, 'th'));

                const logsMap = {};
                logsSnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    logsMap[data.foodId] = data.count || 0;
                });

                if (foodItems.length === 0) {
                    container.innerHTML = `<div class="py-6 text-center text-gray-400 text-sm">ยังไม่มีรายการอาหาร กด "เพิ่มรายการ" ด้านล่าง</div>`;
                    return;
                }

                container.innerHTML = '';
                for (const item of foodItems) {
                    const eatenCount = logsMap[item.id] || 0;
                    const max = item.maxCount || 5;
                    const logDocId = `${item.id}_${monthKey}`;

                    const row = document.createElement('div');
                    row.className = "grid grid-cols-12 py-1.5 items-center text-sm hover:bg-gray-50 transition rounded px-1";
                    row.dataset.logId = logDocId;
                    row.dataset.foodId = item.id;
                    row.dataset.count = eatenCount;
                    row.dataset.max = max;

                    row.innerHTML = `
                        <div class="col-span-4 font-medium text-gray-800 cursor-pointer hover:text-blue-600 food-name-col">${item.name}</div>
                        <div class="col-span-3 text-gray-600">${item.category}</div>
                        <div class="col-span-5 text-left tracking-widest star-container cursor-pointer">${renderStars(eatenCount, max)}</div>
                    `;

                    row.querySelector('.food-name-col').addEventListener('click', () => {
                        document.getElementById('editFoodId').value = item.id;
                        document.getElementById('editFoodName').value = item.name;
                        document.getElementById('editFoodCategory').value = item.category;
                        document.getElementById('editFoodMaxCount').value = max;
                        editModal.classList.remove('hidden');
                        editModal.classList.add('flex');
                    });

                    row.querySelector('.star-container').addEventListener('click', async () => {
                        let currentCount = parseInt(row.dataset.count);
                        let maxCount = parseInt(row.dataset.max);
                        
                        let newCount = currentCount + 1;
                        if (newCount > maxCount) newCount = 0;

                        row.dataset.count = newCount;
                        row.querySelector('.star-container').innerHTML = renderStars(newCount, maxCount);

                        await setDoc(doc(db, "food_logs", logDocId), {
                            foodId: item.id,
                            monthKey: monthKey,
                            count: newCount,
                            updatedAt: new Date().toISOString()
                        });
                    });

                    container.appendChild(row);
                }

            } catch (error) {
                console.error("Error loading data: ", error);
                container.innerHTML = `<div class="py-4 text-center text-red-500 text-sm">เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบการเชื่อมต่อ</div>`;
            }
        }

        document.getElementById('addFoodForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('foodName').value.trim();
            const category = document.getElementById('foodCategory').value;
            const maxCount = parseInt(document.getElementById('foodMaxCount').value) || 5;

            if (!name) return;

            try {
                await addDoc(collection(db, "food_items"), {
                    name: name,
                    category: category,
                    maxCount: maxCount,
                    createdAt: new Date().toISOString()
                });

                document.getElementById('addFoodForm').reset();
                addModal.classList.remove('flex');
                addModal.classList.add('hidden');
                loadData(); 
            } catch (error) {
                console.error("Error adding food item: ", error);
                alert("ไม่สามารถบันทึกข้อมูลได้");
            }
        });

        document.getElementById('editFoodForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const foodId = document.getElementById('editFoodId').value;
            const name = document.getElementById('editFoodName').value.trim();
            const category = document.getElementById('editFoodCategory').value;
            const maxCount = parseInt(document.getElementById('editFoodMaxCount').value) || 5;

            if (!name) return;

            try {
                await setDoc(doc(db, "food_items", foodId), {
                    name: name,
                    category: category,
                    maxCount: maxCount,
                    updatedAt: new Date().toISOString()
                }, { merge: true });

                editModal.classList.remove('flex');
                editModal.classList.add('hidden');
                loadData();
            } catch (error) {
                console.error("Error updating food item: ", error);
                alert("ไม่สามารถบันทึกการแก้ไขได้");
            }
        });

        document.getElementById('decreaseStarBtn').addEventListener('click', async () => {
            const foodId = document.getElementById('editFoodId').value;
            const monthKey = getMonthKey(currentYear, currentMonthIndex);
            const logDocId = `${foodId}_${monthKey}`;

            try {
                const row = document.querySelector(`[data-food-id="${foodId}"]`);
                if (row) {
                    let currentCount = parseInt(row.dataset.count);
                    let newCount = currentCount - 1;
                    if (newCount < 0) newCount = 0;

                    row.dataset.count = newCount;
                    row.querySelector('.star-container').innerHTML = renderStars(newCount, parseInt(row.dataset.max));

                    await setDoc(doc(db, "food_logs", logDocId), {
                        foodId: foodId,
                        monthKey: monthKey,
                        count: newCount,
                        updatedAt: new Date().toISOString()
                    });
                }
                editModal.classList.remove('flex');
                editModal.classList.add('hidden');
            } catch (error) {
                console.error("Error decreasing star: ", error);
            }
        });

        document.getElementById('deleteFoodBtn').addEventListener('click', async () => {
            if (!confirm("คุณต้องการลบรายการอาหารนี้ใช่หรือไม่?")) return;
            const foodId = document.getElementById('editFoodId').value;

            try {
                await deleteDoc(doc(db, "food_items", foodId));
                editModal.classList.remove('flex');
                editModal.classList.add('hidden');
                loadData();
            } catch (error) {
                console.error("Error deleting food item: ", error);
                alert("ไม่สามารถลบรายการได้");
            }
        });

        updateMonthDisplay();
    </script>
</body>
</html>
